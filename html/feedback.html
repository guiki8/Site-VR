<!DOCTYPE html>
<html lang='pt-BR'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>{{ title }}</title>
  <link rel='stylesheet' href='/css/style.css'> {# O link para o CSS é absoluto agora, a partir da raiz do servidor Flask #}
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
    }
    .message-box {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid {{ color }}5;
      box-shadow: 0 0 15px {{ shadow_color }};
    }
    .message-box h2 {
        color: {{ color }};
        text-shadow: 0 0 8px {{ shadow_color }};
    }
    .message-box p {
        margin-top: 15px;
        font-size: 1.1em;
    }
  </style>
</head>
<body class='body_contato'>
  <div class='message-box'>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <p>Você será redirecionado em {{ delay }} segundos.</p>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = "{{ redirect_url }}";
    }, {{ delay }} * 1000);
  </script>
</body>
</html>
