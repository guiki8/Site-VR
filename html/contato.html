<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="body_contato">
  <header>
    <h1>Meu Site</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main class="main_contato">
    <h2>Fale Conosco</h2>
    <p>Entre em contato por meio do formulário ou das redes sociais.</p>

    <form action="/salvar_contato" method="POST" class="contact-form">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required autocomplete="off"></textarea>
      </div>
      <button type="submit">Enviar Mensagem</button>
    </form>
  </main>
  </body>
</html>
