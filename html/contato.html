<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação do Projeto</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="body_contato">
  <header>
    <h1>Imersão com Realidade Virtual - Luva Háptica</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Avaliar</a>
    </nav>
  </header>

  <main class="main_contato">
    <h2>Avalie o Projeto!</h2>
    <p>Sua opinião é muito importante para nós. Deixe sua avaliação abaixo:</p>

    <form id="feedbackForm" class="contact-form" action="processa_contato.php" method="POST">
      <div class="form-group">
        <label for="pontos_positivos">Pontos positivos:</label>
        <textarea id="pontos_positivos" name="pontos_positivos" rows="5" required autocomplete="off"></textarea>
      </div>
      <div class="form-group">
        <label for="pontos_negativos">Pontos negativos:</label>
        <textarea id="pontos_negativos" name="pontos_negativos" rows="5" autocomplete="off"></textarea>
      </div>
      <div class="form-group">
        <label for="sugestoes">Sugestões:</label>
        <textarea id="sugestoes" name="sugestoes" rows="5" autocomplete="off"></textarea>
      </div>
      <button type="submit">Enviar Avaliação</button>
    </form>
  </main>

  </body>
</html>
